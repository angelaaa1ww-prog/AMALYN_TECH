services:
  - type: web
    name: amalyn-tech
    runtime: python
    rootDir: AMALYN_AI
    buildCommand: pip install -r ../requirements-render.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
